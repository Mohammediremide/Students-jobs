<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Brexbin Group Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#4f46e5',
                        accent: '#a855f7',
                        darkBg: '#0f172a'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
        }
        h1, h2, h3, h4, h5, h6, .font-heading {
            font-family: 'Outfit', sans-serif;
        }
    </style>
    <script>
        // PWA registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
    <nav class="bg-slate-900/85 backdrop-blur-md border-b border-slate-800 py-4 shadow-lg z-50">
        <div class="max-w-4xl mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <span class="text-white font-extrabold text-sm">B</span>
                </div>
                <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Group Chat</h1>
            </div>
            <a href="index.html" class="text-slate-300 hover:text-indigo-400 text-sm font-semibold transition-colors flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                Dashboard
            </a>
        </div>
    </nav>
    
    <main class="flex-1 flex flex-col items-center justify-center px-4 py-6">
        <div id="chatStatus" class="mb-3 text-center text-sm font-semibold"></div>
        <div class="w-full max-w-2xl flex flex-col flex-1 h-[70vh] bg-slate-900/50 backdrop-blur-md rounded-3xl border border-slate-800 shadow-2xl overflow-hidden">
            <div id="chatBox" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
            
            <form id="chatForm" class="flex flex-col gap-2 p-4 border-t border-slate-800 bg-slate-900/90 rounded-b-3xl">
                <div id="emojiPicker" class="mb-1 flex flex-wrap gap-2.5 pb-2"></div>
                <div class="flex gap-2">
                    <input type="text" id="chatInput" autocomplete="off" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="Type your message..." required>
                    <div class="flex gap-2">
                        <button type="submit" class="bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold px-6 py-3 rounded-xl transition-all shadow-md">Send</button>
                        <button type="button" id="cancelEditBtn" class="hidden bg-slate-800 hover:bg-slate-750 text-slate-300 border border-slate-700 px-4 py-3 rounded-xl font-semibold transition-colors">Cancel</button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <script>
    function getCurrentUser() {
        return JSON.parse(localStorage.getItem('currentUser') || 'null');
    }
    function getUsers() {
        return JSON.parse(localStorage.getItem('users') || '[]');
    }
    function getMessages() {
        return JSON.parse(localStorage.getItem('groupMessages') || '[]');
    }
    function setMessages(msgs) {
        localStorage.setItem('groupMessages', JSON.stringify(msgs));
    }
    function isAdmin() {
        const user = getCurrentUser();
        return user && (user.email === "admin@brexbin.com" || user.isAdmin === true);
    }
    function showChatStatus(message, isError) {
        const el = document.getElementById('chatStatus');
        if (!el) return;
        if (el._timerId) clearTimeout(el._timerId);
        el.textContent = message;
        el.className = `mb-3 text-center text-sm ${isError ? 'text-rose-400' : 'text-emerald-400'}`;
        el._timerId = setTimeout(() => {
            el.textContent = '';
        }, 6000);
    }

    const emojis = ["😀","😂","😍","😎","👍","🙏","🎉","🔥","😢","😡","❤️","👏"];
    function renderEmojiPicker() {
        const picker = document.getElementById('emojiPicker');
        picker.innerHTML = emojis.map(e => `<button type="button" class="text-2xl hover:scale-125 transition-transform" onclick="insertEmoji('${e}')">${e}</button>`).join(' ');
    }
    function insertEmoji(emoji) {
        const input = document.getElementById('chatInput');
        input.value += emoji;
        input.focus();
    }

    function markMessagesRead() {
        const user = getCurrentUser();
        if (!user) return;
        let messages = getMessages();
        let changed = false;
        messages = messages.map(msg => {
            if (!msg.readBy) msg.readBy = [];
            if (!msg.readBy.includes(user.email)) {
                msg.readBy.push(user.email);
                changed = true;
            }
            return msg;
        });
        if (changed) setMessages(messages);
    }

    function renderChat() {
        const chatBox = document.getElementById('chatBox');
        const messages = getMessages();
        const user = getCurrentUser();
        chatBox.innerHTML = messages.map((msg, idx) => {
            const isMine = user && msg.email === user.email;
            const canDelete = isMine || isAdmin();
            const canEdit = isMine;
            const readCount = msg.readBy ? msg.readBy.length : 0;
            const totalUsers = getUsers().length;
            
            return `
                <div class="flex ${isMine ? 'justify-end' : 'justify-start'} group relative">
                    <div class="max-w-[75%] px-4.5 py-3 rounded-2xl shadow-lg border
                        ${isMine 
                            ? 'bg-gradient-to-br from-indigo-600 to-indigo-700 text-slate-100 rounded-tr-none border-indigo-500/25' 
                            : 'bg-slate-900/90 text-slate-200 rounded-tl-none border-slate-800'}">
                        <div class="text-xs font-bold ${isMine ? 'text-indigo-200' : 'text-indigo-400'} mb-1.5 flex items-center gap-2">
                            <span>${msg.name || msg.email.split('@')[0]}</span>
                            <span class="text-[9px] text-slate-500 font-normal">${new Date(msg.time).toLocaleTimeString()}</span>
                        </div>
                        <div class="break-words text-sm leading-relaxed">${msg.text}</div>
                        <div class="flex gap-3 mt-2 pt-1 border-t border-slate-800/40 text-[10px]">
                            ${canEdit ? `<button class="text-indigo-300 hover:text-indigo-100 font-semibold" onclick="editMessage(${idx})">Edit</button>` : ""}
                            ${canDelete ? `<button class="text-rose-400 hover:text-rose-300 font-semibold" onclick="deleteMessage(${idx})">Delete</button>` : ""}
                        </div>
                        ${readCount === totalUsers ? `
                            <div class="text-[9px] text-slate-500 mt-1.5 text-right font-semibold">✓ Seen by all</div>
                        ` : readCount > 1 ? `
                            <div class="text-[9px] text-slate-500 mt-1.5 text-right">Seen by ${readCount}</div>
                        ` : ''}
                    </div>
                </div>
            `;
        }).join('');
        chatBox.scrollTop = chatBox.scrollHeight;
        markMessagesRead();
    }

    let editingIndex = null;
    function editMessage(idx) {
        const messages = getMessages();
        const user = getCurrentUser();
        if (!user || messages[idx].email !== user.email) return;
        const input = document.getElementById('chatInput');
        const cancelBtn = document.getElementById('cancelEditBtn');
        editingIndex = idx;
        input.value = messages[idx].text;
        input.focus();
        if (cancelBtn) cancelBtn.classList.remove('hidden');
        showChatStatus('Editing message...', false);
    }

    function deleteMessage(idx) {
        const messages = getMessages();
        const user = getCurrentUser();
        if (!user) return;
        if (messages[idx].email === user.email || isAdmin()) {
            messages.splice(idx, 1);
            setMessages(messages);
            renderChat();
            showChatStatus('Message deleted.', true);
        }
    }

    function notifyAllUsersOfGroupMessage(sender, text) {
        let users = getUsers();
        users.forEach(u => {
            if (u.email !== sender.email) {
                let notifs = JSON.parse(localStorage.getItem('notifications_' + u.email) || '[]');
                notifs.unshift({
                    id: Date.now(),
                    message: `Group chat update from ${sender.name || sender.email.split('@')[0]}: "${text}"`,
                    time: new Date().toLocaleString(),
                    read: false
                });
                localStorage.setItem('notifications_' + u.email, JSON.stringify(notifs));
            }
        });
    }

    document.getElementById('chatForm').onsubmit = function(e) {
        e.preventDefault();
        const input = document.getElementById('chatInput');
        const cancelBtn = document.getElementById('cancelEditBtn');
        const text = input.value.trim();
        if (!text) return;
        const user = getCurrentUser();
        if (!user) {
            showChatStatus('You must be logged in to chat.', true);
            return;
        }
        if (editingIndex !== null) {
            const messages = getMessages();
            if (!messages[editingIndex] || messages[editingIndex].email !== user.email) {
                showChatStatus('Unable to edit this message.', true);
                editingIndex = null;
                if (cancelBtn) cancelBtn.classList.add('hidden');
                return;
            }
            messages[editingIndex].text = text;
            setMessages(messages);
            editingIndex = null;
            if (cancelBtn) cancelBtn.classList.add('hidden');
            input.value = '';
            renderChat();
            showChatStatus('Message updated.', false);
            return;
        }
        const msg = {
            email: user.email,
            name: user.name || user.email,
            text,
            time: Date.now(),
            readBy: [user.email]
        };
        const messages = getMessages();
        messages.push(msg);
        setMessages(messages);
        notifyAllUsersOfGroupMessage(user, text);
        input.value = '';
        renderChat();
    };

    document.addEventListener('DOMContentLoaded', () => {
        renderEmojiPicker();
        const cancelBtn = document.getElementById('cancelEditBtn');
        if (cancelBtn) {
            cancelBtn.onclick = function () {
                editingIndex = null;
                document.getElementById('chatInput').value = '';
                cancelBtn.classList.add('hidden');
                showChatStatus('Edit canceled.', true);
            };
        }
    });

    setInterval(renderChat, 2000);
    renderChat();
    </script>
</body>
</html>
